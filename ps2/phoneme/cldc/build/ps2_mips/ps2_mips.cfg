#
# Build configuration for ps2_mips — phoneME Feature CLDC on the PlayStation 2.
#
# The build host is an x86 PC; the target is the PS2 Emotion Engine (MIPS r5900,
# 32-bit ABI, little-endian). This config is a hybrid of two stock configs:
#
#   * build/linux_mips/linux_mips.cfg      — the pure-C interpreter, no JIT, and
#                                            the MIPS cross mechanism (arch=c for
#                                            every pass, target_arch=mips).
#   * build/javacall_linux_arm/….cfg       — the IsTarget wiring that sets
#                                            os_family=javacall and links against
#                                            our javacall port.
#
# Host passes (tools/loopgen/romgen) build with the host gcc (os_family=linux,
# -m32 to model the 32-bit target); the target pass builds with the ps2sdk EE
# toolchain reached through $(GNU_TOOLS_DIR)/bin/{gcc,g++,as,ar} wrappers.
#
# Required environment: JAVACALL_OUTPUT_DIR (our built javacall port: inc/ + lib/).
# GNU_TOOLS_DIR defaults to the ps2sdk cross wrappers baked into phoneme-cross.

ifndef GNU_TOOLS_DIR
GNU_TOOLS_DIR = /usr/local/ps2dev/ee-crosswrap
endif

ifeq ($(JAVACALL_OUTPUT_DIR),)
$(error JAVACALL_OUTPUT_DIR is not set)
endif

#----------------------------------------------------------------------
# Host configuration (where the build tools and romizer run).
#----------------------------------------------------------------------
archExpr = case "`uname -m`" in  \
                i[3-6]86) \
                    echo i386 \
                    ;; \
                i86pc) \
                    echo i386 \
                    ;; \
                x86_64) \
                    echo i386 \
                    ;; \
                *) \
                    uname -m  \
                    ;; \
        esac
host_arch = $(shell $(archExpr) )
host_os  = linux
os_family = linux
compiler  = gcc
arch      = c

# Pure-C interpreter, no interpreter generator, no JIT compiler. This is what
# lets a brand-new CPU (r5900) run without any hand-written assembly loop.
export ENABLE_C_INTERPRETER             = true
export ENABLE_C_INTERPRETER__BY         = ps2_mips.cfg
export ENABLE_INTERPRETER_GENERATOR     = false
export ENABLE_INTERPRETER_GENERATOR__BY = ps2_mips.cfg
# PS2ME JIT (r5900), opt-in via PS2ME_JIT=true. Keeps the pure-C interpreter
# (iarch=c) and ADDS the MIPS dynamic-compiler backend (carch=mips, cpu/mips/).
# A build WITHOUT PS2ME_JIT is byte-identical to production: ENABLE_COMPILER=false
# so no compiler framework is linked and the interpreter's #if ENABLE_COMPILER
# hooks stay out. See JIT_PLAN.md Fase 0.
ifeq ($(PS2ME_JIT), true)
export ENABLE_COMPILER                  = true
export ENABLE_COMPILER__BY              = ps2_mips.cfg (PS2ME_JIT)
else
export ENABLE_COMPILER                  = false
export ENABLE_COMPILER__BY              = ps2_mips.cfg
endif

# No OS timer thread: our javacall port drives the scheduler tick itself
# (the cyclic 30 ms EE alarm in ps2/javacall). Green threads on one OS thread.
ifndef ENABLE_TIMER_THREAD
export ENABLE_TIMER_THREAD     = false
export ENABLE_TIMER_THREAD__BY = ps2_mips.cfg
endif

# The romizer/loopgen emit GNU-style C/asm for a gcc target.
LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS  = +GenerateGNUCode

# MakeDeps platform for the javacall os-family (POSIX-style path handling).
MakeDepsMain_javacall = UnixPlatform
MakeDepsOpts_javacall = -resolveVpath true

ifeq ($(IsRomGen), true)
    # RomGen: a host executable running the C interpreter to romize the class
    # library into the (machine-independent) ROMImage.cpp.
    ROM_GEN_FLAGS = +GenerateGNUCode -EnableROMCompilation
endif

ifeq ($(IsTarget), true)
    # The Emotion Engine VM: delivered as libcldc_vm*.a archives (+ ROMImage,
    # NativesTable). The final PS2 ELF is linked separately by our ps2sdk EE
    # build against these archives + libjavacall.a + ps2sdk, so phoneME must NOT
    # link an executable here.
    target_platform = linux_javacall
    os_family       = javacall
    arch            = c
    target_arch     = mips
    compiler        = gcc

    # PS2ME JIT: the compiler CPU backend is mips (cpu/mips/), while the
    # interpreter CPU stays c (iarch defaults to arch=c). iarch/carch default to
    # arch unless set (MacroDefinitions.java) -> this is the C-interp + MIPS-JIT
    # hybrid. Only the on-target pass gets a MIPS compiler; host romgen/loopgen
    # keep arch=c/i386 with ENABLE_COMPILER=false.
    ifeq ($(PS2ME_JIT), true)
    carch           = mips
    endif

    # PS2ME JIT Fase 1 self-test ("returns 42"): opt-in, orthogonal to PS2ME_JIT.
    # Emits a real r5900 function at VM init, runs it, logs the result (see
    # BinaryAssembler_mips.cpp / patch #36). Off by default -> production and the
    # plain PS2ME_JIT build are unaffected.
    ifeq ($(PS2ME_JIT_SELFTEST), true)
    CPP_DEF_FLAGS  += -DPS2ME_JIT_SELFTEST
    endif

    # PS2ME JIT Fase 2 milestone: arm one trivial method, compile it, run it via
    # the compiled path (see Interpreter_c.cpp jit_fase2_arm + CodeGenerator_mips).
    # Opt-in; off by default so the plain PS2ME_JIT build stays dormant.
    ifeq ($(PS2ME_JIT_FASE2), true)
    CPP_DEF_FLAGS  += -DPS2ME_JIT_FASE2
    endif

    export GENERATE_EXECUTABLE     = false
    export GENERATE_EXECUTABLE__BY = ps2_mips.cfg

    JAVACALL_INCLUDE_DIR = $(JAVACALL_OUTPUT_DIR)/inc
    JAVACALL_LIB_DIR     = $(JAVACALL_OUTPUT_DIR)/lib

    ifeq ($(USE_DEBUG),true)
    BUILD_EXT_javacall = _g
    else
    BUILD_EXT_javacall =
    endif

    # javacall interface headers for the os/javacall glue; the implementation and
    # javanotify stubs are consumed only at the (external) final ELF link.
    CPP_DEF_FLAGS += -I"$(JAVACALL_INCLUDE_DIR)" -DMIPS -G0
    LINK_FLAGS    += "$(JAVACALL_LIB_DIR)/libjavacall$(BUILD_EXT_javacall).a"
    JC_STUBS_OBJ   = "$(JAVACALL_LIB_DIR)/cldc_javanotify_stubs.o"

    # PCSL: the javacall os-family implements OsFile/Stream over PCSL (OsFile.cpp
    # calls pcsl_file_*), so the target needs ENABLE_PCSL. PCSL is cross-built for
    # MIPS separately (see build-cldc-ps2.sh) into $(PCSL_OUTPUT_DIR)/linux_mips.
    # USE_UNICODE_FOR_FILENAMES is mandatory when ENABLE_PCSL (OsFile.cpp #errors
    # otherwise): PCSL filenames are 16-bit pcsl_strings.
    export ENABLE_PCSL     = true
    export ENABLE_PCSL__BY = ps2_mips.cfg
    PCSL_DIST_DIR = $(PCSL_OUTPUT_DIR)/linux_mips
    CPP_DEF_FLAGS += -DUSE_UNICODE_FOR_FILENAMES=1
endif

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES  = true
endif

ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE  = 35
endif
